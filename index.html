<!doctype html>
<html lang="tr" data-since="2026-10-13" data-page="giris">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10100f">
<title>Zamandan bir iz</title>
<script src="/guard.js"></script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Zamandan bir iz">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
<section class="gate" id="gate" data-key="1d7b87d2">
  <div class="gate-moon" aria-hidden="true"></div>
  <h1 class="gate-title">Zamandan bir iz</h1>
  <p class="gate-prompt" id="gatePrompt">O tarihi yaz.</p>
  <div class="date-field" id="dateField">
    <label class="sr-only" for="dateInput">Tarih: gün, ay ve yıl, yalnızca rakamlarla</label>
    <input id="dateInput" class="date-input" type="text" inputmode="numeric" pattern="[0-9]*"
      maxlength="8" autocomplete="off" autocorrect="off" spellcheck="false" aria-describedby="gatePrompt gateMsg">
    <div class="slots" aria-hidden="true">
      <span class="slot"></span><span class="slot"></span><span class="sep">.</span>
      <span class="slot"></span><span class="slot"></span><span class="sep">.</span>
      <span class="slot"></span><span class="slot"></span><span class="slot"></span><span class="slot"></span>
    </div>
  </div>
  <p class="gate-msg" id="gateMsg" aria-live="polite"></p>
  <p class="gate-clue" id="gateClue" aria-live="polite"></p>
</section>
<section class="entry" id="entry" hidden tabindex="-1" aria-labelledby="entryTitle">
  <div class="moon" aria-hidden="true"></div>
  <h1 id="entryTitle">Zamandan bir iz</h1>
  <p class="intro">Üç zarf, üç zaman.</p>
  <ol class="eras" aria-label="Mektuplar">
    <li><span class="era-moon era-past" aria-hidden="true"></span><span>Geçmiş</span></li>
    <li><span class="era-moon era-now" aria-hidden="true"></span><span>Şimdi</span></li>
    <li><span class="era-moon era-future" aria-hidden="true"></span><span>Gelecek</span></li>
  </ol>
  <p class="music-note" id="musicNote" aria-live="polite">Her zarf kendi sessizliğiyle açılır. Ekrana dokunduğunda müzik kaldığı yerden devam eder.</p>
  <a class="btn entry-go" href="/mektup-1/">Mektuba geç</a>
</section>
</main>
<script src="/ortak.js"></script>
<script src="/muzik/liste.js"></script>
<script src="/muzik.js"></script>
<script src="/kapi.js"></script>
</body>
</html>
